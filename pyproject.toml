[project]
name = "platform-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.21.1","rich>=14.3.2","pydantic>=2.12.5","pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=9.0.2","ruff>=0.15.0","mypy>=1.19.1","types-pyyaml>=6.0.12.20250915"]

[project.scripts]
platform-agent = "platform_agent.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_agent"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
