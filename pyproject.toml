[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.21.0",
  "agent-protocol @ git+https://github.com/foundry-engineering/agent-protocol.git@0b15c1d71da86b0543cade03416f41907516f448",
]

[project.optional-dependencies]
integration = [
  "engineering-agent @ git+https://github.com/foundry-engineering/engineering-agent.git@5b2cf1cdbfb6d962e307d8c033c2f38ebc2a5331",
]
worker = [
  "foundry-runners @ git+https://github.com/foundry-engineering/foundry-runners.git@bcad6565737effdfcfbd8e769d2d2a2392723056",
]
dev = [
  "pytest>=9",
  "ruff>=0.15",
  "mypy>=1.19",
  "types-jsonschema>=4.26.0.20260202",
]

[project.scripts]
platform-agent = "platform_agent.cli:app"
foundry-artifact-worker = "platform_agent.core_worker_service:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
