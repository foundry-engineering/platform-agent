[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.21.0",
  "agent-protocol @ git+https://github.com/foundry-engineering/agent-protocol.git@43c72f711ed095069a56ba6844d8672807cba19d",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "ruff>=0.15",
  "mypy>=1.19",
  "types-jsonschema>=4.26.0.20260202",
]

[project.scripts]
platform-agent = "platform_agent.cli:app"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
