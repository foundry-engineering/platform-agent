[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.21.0",
  "engineering-agent @ git+https://github.com/foundry-engineering/engineering-agent.git@641fb080611f3328f96a74dc065f03958a671d27",
  "agent-protocol @ git+https://github.com/foundry-engineering/agent-protocol.git@bb2573705a8b73a61d359d8e895081ef0268ec97",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "ruff>=0.15",
  "mypy>=1.19",
]

[project.scripts]
platform-agent = "platform_agent.cli:app"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
