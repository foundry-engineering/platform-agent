name: ci
'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform_ci
          POSTGRES_PASSWORD: platform_ci_test_only
          POSTGRES_DB: platform_authority_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_ci -d platform_authority_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout platform agent
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync pinned protocol and development dependencies
        env:
          GIT_TOKEN: ${{ secrets.FOUNDRY_CI_READ_TOKEN }}
        run: |
          test -n "${GIT_TOKEN}" || { echo "::error::FOUNDRY_CI_READ_TOKEN is not set"; exit 1; }
          echo "::add-mask::${GIT_TOKEN}"
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          uv sync --extra dev --extra worker --extra integration --locked
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run ruff check .
      - run: uv run mypy src scripts/verify_live_core_authority.py
      - name: Checkout coordinated runner
        uses: actions/checkout@v4
        with:
          repository: foundry-engineering/foundry-runners
          ref: 66f3bad6600b91d3e72653069b77d0ae79e67119
          token: ${{ secrets.FOUNDRY_CI_READ_TOKEN }}
          path: .integration/runner
          persist-credentials: false
      - name: Pull reviewed image for signed Builder repair acceptance
        run: docker pull docker.io/library/python@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
      - name: Pull immutable JavaScript and Go compilers for actual model work
        run: |
          docker pull docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
          docker pull docker.io/library/golang@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
      - name: Concrete worker and signed Builder private-delivery acceptance
        env:
          FOUNDRY_BUILDER_REAL_DOCKER: '1'
        run: uv run pytest tests -q --ignore=tests/test_postgres_artifact_worker.py
      - name: Actual PostgreSQL worker issuance and six budget scopes
        env:
          FOUNDRY_PLATFORM_PG_TEST: '1'
          FOUNDRY_BUILDER_REAL_DOCKER: '1'
          FOUNDRY_PLATFORM_TEST_DATABASE_URL: postgres://platform_ci:platform_ci_test_only@127.0.0.1:5432/platform_authority_test
          FOUNDRY_RUNNER_SOURCE_ROOT: ${{ github.workspace }}/.integration/runner
        run: uv run pytest tests/test_postgres_artifact_worker.py -vv
      - name: Fetch checksum-pinned coding model and CPU runtime
        if: github.event_name != 'push'
        timeout-minutes: 7
        run: |
          uv run foundry-model-host fetch-assets "$RUNNER_TEMP/foundry-coding-model"
      - name: Managed model host through signed worker, PostgreSQL and Docker
        if: github.event_name != 'push'
        env:
          FOUNDRY_PLATFORM_PG_TEST: '1'
          FOUNDRY_BUILDER_REAL_DOCKER: '1'
          FOUNDRY_PLATFORM_TEST_DATABASE_URL: postgres://platform_ci:platform_ci_test_only@127.0.0.1:5432/platform_authority_test
          FOUNDRY_RUNNER_SOURCE_ROOT: ${{ github.workspace }}/.integration/runner
        run: |
          FOUNDRY_BUILDER_MODEL_ASSETS="$RUNNER_TEMP/foundry-coding-model" \
            uv run pytest -s -vv 'tests/test_postgres_artifact_worker.py::test_core_builder_runs_metered_model_and_final_scanned_zip[live_polyglot]' 'tests/test_postgres_artifact_worker.py::test_core_builder_runs_metered_model_and_final_scanned_zip[live]' 'tests/test_postgres_artifact_worker.py::test_core_builder_runs_metered_model_and_final_scanned_zip[live_units]' 'tests/test_postgres_artifact_worker.py::test_core_builder_runs_metered_model_and_final_scanned_zip[live_auto]'
      - name: Provision the frozen 30B coding candidate inside existing CI capacity
        if: github.event_name != 'push'
        timeout-minutes: 10
        run: |
          install -m 0600 deploy/profiles/qwen3-coder-30b-a3b-q2-xl.json "$RUNNER_TEMP/foundry-coder30b-profile.json"
          uv run python - <<'PYCODE'
          import json, os, shutil
          from pathlib import Path
          from engineering_agent.model_profiles import load_model_profile, profile_readiness
          from engineering_agent.model_host import RUNTIME
          directory = Path(os.environ["RUNNER_TEMP"])
          profile = load_model_profile(directory / "foundry-coder30b-profile.json")
          readiness = profile_readiness(profile, directory / "foundry-coder30b-model", RUNTIME)
          print(json.dumps(readiness, sort_keys=True))
          assert readiness["memory_sufficient"] and readiness["platform_supported"], "existing CI capacity cannot host the approved coding candidate"
          required_disk = sum(asset.size for asset in profile.weights) + RUNTIME.size + 1024**3
          assert shutil.disk_usage(directory).free >= required_disk, "existing CI disk cannot hold the approved coding candidate"
          PYCODE
          uv run foundry-model-host fetch-assets "$RUNNER_TEMP/foundry-coder30b-model" --profile "$RUNNER_TEMP/foundry-coder30b-profile.json"
      - name: Fixed public tasks and bounded repairs of recorded model errors
        if: github.event_name != 'push'
        env:
          FOUNDRY_PLATFORM_PG_TEST: '1'
          FOUNDRY_REQUIRE_AGENT_REPAIR_GATE: '1'
          FOUNDRY_BUILDER_REAL_DOCKER: '1'
          FOUNDRY_PLATFORM_TEST_DATABASE_URL: postgres://platform_ci:platform_ci_test_only@127.0.0.1:5432/platform_authority_test
          FOUNDRY_RUNNER_SOURCE_ROOT: ${{ github.workspace }}/.integration/runner
        run: |
          FOUNDRY_BUILDER_MODEL_ASSETS="$RUNNER_TEMP/foundry-coder30b-model" \
          FOUNDRY_QUALITY_MODEL_PROFILE="$RUNNER_TEMP/foundry-coder30b-profile.json" \
          FOUNDRY_QUALITY_REPORT="$RUNNER_TEMP/foundry-public-quality.json" \
            uv run pytest -s -vv tests/test_postgres_artifact_worker.py -k multiple
      - name: Preserve actual public quality counts and immutable evidence
        if: github.event_name != 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent01-public-quality
          path: ${{ runner.temp }}/foundry-public-quality.json
          if-no-files-found: warn
          retention-days: 14
      - name: Checkout coordinated registry
        uses: actions/checkout@v4
        with:
          repository: foundry-engineering/foundry-registry
          ref: d2223b310c587afe61376e9a1eacb3f8ffc1def7
          token: ${{ secrets.FOUNDRY_CI_READ_TOKEN }}
          path: .integration/registry
          persist-credentials: false
      - name: Type-check and execute cross-repository contract handoff
        env:
          PYTHONPATH: ${{ github.workspace }}/.integration/runner/src
          MYPYPATH: ${{ github.workspace }}/.integration/runner/src
        run: |
          uv run mypy scripts/verify_registry_runner_contract.py
          uv run python scripts/verify_registry_runner_contract.py --registry-root .integration/registry --registry-commit d2223b310c587afe61376e9a1eacb3f8ffc1def7

      - name: Checkout verified Core application
        uses: actions/checkout@v4
        with:
          repository: foundry-engineering/foundry-core
          ref: 09396ed9f42989b4293be218b073328f95f24973
          token: ${{ secrets.FOUNDRY_CI_READ_TOKEN }}
          path: .integration/core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Core private-storage runtime
        working-directory: .integration/core
        run: uv sync --locked --extra storage
      - name: Build actual Core application
        working-directory: .integration/core/platform-ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Actual Core and Platform authority over HTTPS and PostgreSQL
        working-directory: .integration/core/platform-ui
        env:
          DATABASE_URL: postgres://platform_ci:platform_ci_test_only@127.0.0.1:5432/platform_authority_test
          FOUNDRY_SCOPE_DB_TEST: '1'
          FOUNDRY_CORE_AUTHORITY_PROBE: ${{ github.workspace }}/scripts/verify_live_core_authority.py
          FOUNDRY_CORE_AUTHORITY_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm run verify:runtime-http
